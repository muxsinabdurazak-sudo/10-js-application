<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizMaster - Online Quiz System</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Simple fade-in animation for views */
        .view { display: none; opacity: 0; transition: opacity 0.3s ease-in; }
        .view.active { display: block; opacity: 1; }
        /* Custom scrollbar for quiz container */
        .quiz-container { max-height: 80vh; overflow-y: auto; }
    </style>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-900">

    <!-- Navigation Bar -->
    <nav id="navbar" class="bg-white shadow-md fixed top-0 left-0 right-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="#" onclick="navigate('home')" class="flex-shrink-0 flex items-center">
                        <i class="fas fa-brain text-indigo-600 text-2xl mr-2"></i>
                        <span class="font-bold text-xl text-gray-800">QuizMaster</span>
                    </a>
                </div>
                <div class="flex items-center space-x-4" id="nav-links">
                    <!-- Dynamic navigation links injected via JS -->
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="pt-20 pb-10 min-h-screen">
        <!-- Home / Browse Quizzes View -->
        <div id="view-home" class="view max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-3xl font-bold text-gray-800">Available Quizzes</h2>
                <div class="flex space-x-2">
                    <input type="text" id="search-input" placeholder="Search quizzes..." class="border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button onclick="renderHome()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700"><i class="fas fa-search"></i></button>
                </div>
            </div>
            <div id="quiz-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Quiz cards injected here -->
            </div>
        </div>

        <!-- Auth Views (Login / Register) -->
        <div id="view-auth" class="view max-w-md mx-auto mt-10">
            <div class="bg-white p-8 border rounded-lg shadow-lg">
                <h2 id="auth-title" class="text-2xl font-bold mb-6 text-center">Login</h2>
                <form id="auth-form" onsubmit="handleAuth(event)">
                    <div id="auth-username-field" class="mb-4 hidden">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="auth-username">Username</label>
                        <input type="text" id="auth-username" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="auth-email">Email</label>
                        <input type="email" id="auth-email" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div class="mb-6">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="auth-password">Password</label>
                        <input type="password" id="auth-password" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-indigo-700 transition duration-300">Submit</button>
                </form>
                <p class="text-center text-sm text-gray-600 mt-4">
                    <span id="auth-switch-text">Don't have an account?</span>
                    <a href="#" onclick="toggleAuthMode()" class="text-indigo-600 hover:underline font-bold" id="auth-switch-link">Register here</a>
                </p>
            </div>
        </div>

        <!-- Quiz Attempt View -->
        <div id="view-quiz-attempt" class="view max-w-3xl mx-auto">
            <div class="bg-white rounded-lg shadow-lg p-6 quiz-container">
                <div class="flex justify-between items-center mb-6 border-b pb-4">
                    <h2 id="attempt-title" class="text-2xl font-bold text-gray-800"></h2>
                    <div id="attempt-timer" class="text-xl font-bold text-red-600 hidden">
                        <i class="fas fa-clock mr-1"></i> <span id="timer-display">00:00</span>
                    </div>
                </div>
                <div class="mb-4 text-gray-600">Question <span id="current-q-num">1</span> of <span id="total-q-num">10</span></div>
                <div id="question-container" class="mb-8">
                    <h3 id="question-text" class="text-xl font-semibold mb-6"></h3>
                    <div id="options-container" class="space-y-3">
                        <!-- Options injected here -->
                    </div>
                </div>
                <div class="flex justify-between items-center mt-8 border-t pt-4">
                    <button onclick="navigateQuestion(-1)" id="btn-prev" class="bg-gray-300 text-gray-700 font-bold py-2 px-4 rounded-lg hover:bg-gray-400 disabled:opacity-50" disabled>
                        <i class="fas fa-arrow-left mr-1"></i> Previous
                    </button>
                    <button onclick="submitQuiz()" id="btn-submit" class="bg-green-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-green-700 hidden">
                        Submit Quiz <i class="fas fa-check ml-1"></i>
                    </button>
                    <button onclick="navigateQuestion(1)" id="btn-next" class="bg-indigo-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-indigo-700">
                        Next <i class="fas fa-arrow-right ml-1"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Quiz Results View -->
        <div id="view-results" class="view max-w-3xl mx-auto">
            <div class="bg-white rounded-lg shadow-lg p-6">
                <div class="text-center border-b pb-6 mb-6">
                    <h2 class="text-3xl font-bold text-gray-800 mb-2">Quiz Completed!</h2>
                    <div class="text-5xl font-bold text-indigo-600 mb-2" id="result-score">0%</div>
                    <p class="text-gray-600" id="result-summary">0 out of 0 correct</p>
                </div>
                <h3 class="text-xl font-bold mb-4">Review Answers</h3>
                <div id="result-review" class="space-y-6">
                    <!-- Review items injected here -->
                </div>
                <div class="mt-8 text-center">
                    <button onclick="navigate('home')" class="bg-indigo-600 text-white font-bold py-2 px-6 rounded-lg hover:bg-indigo-700">Back to Quizzes</button>
                </div>
            </div>
        </div>

        <!-- Creator Dashboard View -->
        <div id="view-creator" class="view max-w-4xl mx-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-3xl font-bold text-gray-800">Creator Dashboard</h2>
                <button onclick="showCreateQuizForm()" class="bg-indigo-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-indigo-700">
                    <i class="fas fa-plus mr-2"></i> New Quiz
                </button>
            </div>
            
            <!-- Create/Edit Quiz Form -->
            <div id="creator-form-container" class="bg-white p-6 rounded-lg shadow-lg mb-8 hidden">
                <h3 class="text-2xl font-bold mb-4" id="form-title">Create New Quiz</h3>
                <form onsubmit="saveQuiz(event)">
                    <input type="hidden" id="quiz-edit-id">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-sm font-bold mb-1">Title</label>
                            <input type="text" id="quiz-title" required class="w-full px-3 py-2 border rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-1">Category</label>
                            <input type="text" id="quiz-category" required class="w-full px-3 py-2 border rounded-lg">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-bold mb-1">Description</label>
                        <textarea id="quiz-desc" rows="2" required class="w-full px-3 py-2 border rounded-lg"></textarea>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                        <div>
                            <label class="block text-sm font-bold mb-1">Time Limit (mins, 0=none)</label>
                            <input type="number" id="quiz-time" value="0" min="0" class="w-full px-3 py-2 border rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-1">Max Attempts (0=unlimited)</label>
                            <input type="number" id="quiz-attempts" value="0" min="0" class="w-full px-3 py-2 border rounded-lg">
                        </div>
                        <div class="flex items-center pt-6">
                            <input type="checkbox" id="quiz-published" class="mr-2 h-4 w-4">
                            <label for="quiz-published" class="text-sm font-bold">Publish Quiz</label>
                        </div>
                    </div>

                    <div class="border-t pt-4 mt-4">
                        <h4 class="font-bold mb-2">Questions</h4>
                        <div id="questions-list-editor" class="space-y-4 mb-4">
                            <!-- Questions injected here -->
                        </div>
                        <button type="button" onclick="addQuestionToForm()" class="text-indigo-600 font-bold hover:underline"><i class="fas fa-plus mr-1"></i> Add Question</button>
                    </div>
                    
                    <div class="mt-6 flex justify-end space-x-2">
                        <button type="button" onclick="hideCreateQuizForm()" class="bg-gray-300 text-gray-700 font-bold py-2 px-4 rounded-lg hover:bg-gray-400">Cancel</button>
                        <button type="submit" class="bg-green-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-green-700">Save Quiz</button>
                    </div>
                </form>
            </div>

            <!-- List of Created Quizzes -->
            <div id="creator-quiz-list" class="space-y-4">
                <!-- Creator quiz cards injected here -->
            </div>
        </div>

    </main>

    <script>
        // --- DATA LAYER (Mock DB with LocalStorage) ---
        const DB_USERS = 'quizmaster_users';
        const DB_QUIZZES = 'quizmaster_quizzes';
        const DB_ATTEMPTS = 'quizmaster_attempts';
        const AUTH_TOKEN = 'quizmaster_token';

        const getUsers = () => JSON.parse(localStorage.getItem(DB_USERS)) || [];
        const saveUsers = (users) => localStorage.setItem(DB_USERS, JSON.stringify(users));
        const getQuizzes = () => JSON.parse(localStorage.getItem(DB_QUIZZES)) || [];
        const saveQuizzes = (quizzes) => localStorage.setItem(DB_QUIZZES, JSON.stringify(quizzes));
        const getAttempts = () => JSON.parse(localStorage.getItem(DB_ATTEMPTS)) || [];
        const saveAttempts = (attempts) => localStorage.setItem(DB_ATTEMPTS, JSON.stringify(attempts));
        
        const getCurrentUser = () => {
            const token = localStorage.getItem(AUTH_TOKEN);
            if (!token) return null;
            return JSON.parse(token); // In real app, this would be decoded JWT
        };

        const setCurrentUser = (user) => {
            if (user) localStorage.setItem(AUTH_TOKEN, JSON.stringify(user));
            else localStorage.removeItem(AUTH_TOKEN);
        };

        // Initialize sample data if empty
        function initSampleData() {
            if (getQuizzes().length === 0) {
                const sampleQuiz = {
                    id: 'q1', creatorId: 'system', title: 'JavaScript Basics', category: 'Programming',
                    description: 'Test your knowledge of fundamental JavaScript concepts.',
                    timeLimit: 5, maxAttempts: 0, isPublished: true,
                    questions: [
                        { id: 'q1q1', text: 'Which keyword is used to declare a constant in JS?', type: 'multiple_choice', options: [
                            { id: 'o1', text: 'var', isCorrect: false }, { id: 'o2', text: 'let', isCorrect: false },
                            { id: 'o3', text: 'const', isCorrect: true }, { id: 'o4', text: 'static', isCorrect: false }
                        ], explanation: 'The const keyword is used to declare a variable whose value should not be reassigned.', points: 1 },
                        { id: 'q1q2', text: 'HTML stands for HyperText Markup Language.', type: 'true_false', options: [
                            { id: 'o5', text: 'True', isCorrect: true }, { id: 'o6', text: 'False', isCorrect: false }
                        ], explanation: 'HTML is indeed the standard markup language for creating web pages.', points: 1 }
                    ]
                };
                saveQuizzes([sampleQuiz]);
            }
            if (getUsers().length === 0) {
                saveUsers([{ id: 'admin', username: 'admin', email: 'admin@quiz.com', password: 'admin123', role: 'creator' }]);
            }
        }

        // --- UI/ROUTING LAYER ---
        let currentView = 'home';
        let authMode = 'login'; // or 'register'
        let currentAttemptState = null; // Holds state during quiz taking
        let timerInterval = null;

        function navigate(view) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            const viewEl = document.getElementById(`view-${view}`);
            if (viewEl) {
                viewEl.classList.add('active');
                currentView = view;
            }
            updateNavbar();
            
            // Render data for the view
            if (view === 'home') renderHome();
            if (view === 'creator') renderCreatorDashboard();
            if (view === 'quiz-attempt' || view === 'results') {
                // Handled specifically by attempt functions
            }
        }

        function updateNavbar() {
            const user = getCurrentUser();
            const navLinks = document.getElementById('nav-links');
            
            if (user) {
                let html = `
                    <a href="#" onclick="navigate('home')" class="text-gray-600 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium">Browse</a>
                `;
                if (user.role === 'creator') {
                    html += `<a href="#" onclick="navigate('creator')" class="text-gray-600 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium">Dashboard</a>`;
                }
                html += `
                    <span class="text-gray-800 font-medium px-3 py-2"><i class="fas fa-user mr-1"></i> ${user.username}</span>
                    <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded-lg text-sm hover:bg-red-600">Logout</button>
                `;
                navLinks.innerHTML = html;
            } else {
                navLinks.innerHTML = `
                    <button onclick="showAuth('login')" class="text-indigo-600 hover:text-indigo-800 font-medium px-3 py-2 text-sm">Login</button>
                    <button onclick="showAuth('register')" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-indigo-700">Register</button>
                `;
            }
        }

        // --- AUTH LOGIC ---
        function showAuth(mode) {
            authMode = mode;
            document.getElementById('view-auth').classList.add('active');
            currentView = 'auth';
            
            const titleEl = document.getElementById('auth-title');
            const usernameField = document.getElementById('auth-username-field');
            const switchText = document.getElementById('auth-switch-text');
            const switchLink = document.getElementById('auth-switch-link');
            
            document.getElementById('auth-form').reset();

            if (mode === 'login') {
                titleEl.textContent = 'Login';
                usernameField.classList.add('hidden');
                switchText.textContent = "Don't have an account?";
                switchLink.textContent = 'Register here';
                switchLink.setAttribute('onclick', "showAuth('register')");
            } else {
                titleEl.textContent = 'Register';
                usernameField.classList.remove('hidden');
                switchText.textContent = "Already have an account?";
                switchLink.textContent = 'Login here';
                switchLink.setAttribute('onclick', "showAuth('login')");
            }
        }

        function toggleAuthMode() {
            showAuth(authMode === 'login' ? 'register' : 'login');
        }

        function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            let users = getUsers();

            if (authMode === 'register') {
                const username = document.getElementById('auth-username').value;
                if (users.find(u => u.email === email)) {
                    alert('Email already exists!'); return;
                }
                const newUser = { id: 'u' + Date.now(), username, email, password, role: 'user' }; // Plain text pass for demo
                users.push(newUser);
                saveUsers(users);
                setCurrentUser(newUser);
                alert('Registration successful! For demo purposes, you have been logged in. To create quizzes, use admin@quiz.com / admin123.');
                navigate('home');
            } else {
                const user = users.find(u => u.email === email && u.password === password);
                if (user) {
                    setCurrentUser(user);
                    navigate('home');
                } else {
                    alert('Invalid email or password!');
                }
            }
        }

        function logout() {
            setCurrentUser(null);
            navigate('home');
        }

        // --- HOME & BROWSING LOGIC ---
        function renderHome() {
            const searchTerm = document.getElementById('search-input')?.value.toLowerCase() || '';
            const quizzes = getQuizzes().filter(q => q.isPublished && (q.title.toLowerCase().includes(searchTerm) || q.category.toLowerCase().includes(searchTerm)));
            const container = document.getElementById('quiz-list');
            const user = getCurrentUser();
            const attempts = getAttempts();

            if (quizzes.length === 0) {
                container.innerHTML = `<div class="col-span-3 text-center text-gray-500 py-10">No quizzes found.</div>`;
                return;
            }

            container.innerHTML = quizzes.map(q => {
                const userAttempts = user ? attempts.filter(a => a.quizId === q.id && a.userId === user.id).length : 0;
                const attemptsLeft = q.maxAttempts === 0 ? 'Unlimited' : q.maxAttempts - userAttempts;
                
                return `
                <div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-lg transition duration-300 border border-gray-100">
                    <div class="p-5">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs font-semibold px-2 py-1 rounded bg-indigo-100 text-indigo-600">${q.category}</span>
                            ${q.timeLimit > 0 ? `<span class="text-xs font-semibold text-gray-500"><i class="fas fa-clock"></i> ${q.timeLimit} mins</span>` : ''}
                        </div>
                        <h3 class="font-bold text-xl mb-2 text-gray-800">${q.title}</h3>
                        <p class="text-gray-600 text-sm mb-4">${q.description}</p>
                        <div class="flex justify-between items-center text-sm text-gray-500 mb-4">
                            <span><i class="fas fa-list-ol"></i> ${q.questions.length} Questions</span>
                            <span><i class="fas fa-redo"></i> ${attemptsLeft} attempts left</span>
                        </div>
                        <button onclick="startQuiz('${q.id}')" class="w-full bg-indigo-600 text-white font-bold py-2 rounded hover:bg-indigo-700 transition duration-300">
                            Start Quiz
                        </button>
                    </div>
                </div>`;
            }).join('');
        }

        // --- QUIZ ATTEMPT LOGIC ---
        function startQuiz(quizId) {
            const user = getCurrentUser();
            if (!user) {
                alert("Please login to take a quiz.");
                showAuth('login');
                return;
            }

            const quiz = getQuizzes().find(q => q.id === quizId);
            const attempts = getAttempts();
            const userAttempts = attempts.filter(a => a.quizId === quizId && a.userId === user.id).length;
            
            if (quiz.maxAttempts > 0 && userAttempts >= quiz.maxAttempts) {
                alert("You have reached the maximum number of attempts for this quiz.");
                return;
            }

            // Initialize attempt state
            currentAttemptState = {
                quizId: quizId,
                userId: user.id,
                currentQuestionIndex: 0,
                answers: {}, // Format: { questionId: selectedOptionId }
                timeRemaining: quiz.timeLimit > 0 ? quiz.timeLimit * 60 : null,
                startTime: new Date().toISOString()
            };

            navigate('quiz-attempt');
            renderQuestion();
            
            if (currentAttemptState.timeRemaining !== null) {
                document.getElementById('attempt-timer').classList.remove('hidden');
                startTimer();
            } else {
                document.getElementById('attempt-timer').classList.add('hidden');
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (currentAttemptState.timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    alert("Time's up! Submitting quiz automatically.");
                    submitQuiz();
                    return;
                }
                currentAttemptState.timeRemaining--;
                const mins = Math.floor(currentAttemptState.timeRemaining / 60);
                const secs = currentAttemptState.timeRemaining % 60;
                document.getElementById('timer-display').textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }, 1000);
        }

        function renderQuestion() {
            const quiz = getQuizzes().find(q => q.id === currentAttemptState.quizId);
            const qIndex = currentAttemptState.currentQuestionIndex;
            const question = quiz.questions[qIndex];
            const totalQ = quiz.questions.length;

            document.getElementById('attempt-title').textContent = quiz.title;
            document.getElementById('current-q-num').textContent = qIndex + 1;
            document.getElementById('total-q-num').textContent = totalQ;
            document.getElementById('question-text').textContent = question.text;

            // Options
            const optionsHtml = question.options.map(opt => {
                const isSelected = currentAttemptState.answers[question.id] === opt.id;
                return `
                    <div onclick="selectOption('${question.id}', '${opt.id}')" 
                         class="p-4 border rounded-lg cursor-pointer flex items-center transition duration-200 ${isSelected ? 'bg-indigo-50 border-indigo-500 ring-2 ring-indigo-200' : 'hover:bg-gray-50 border-gray-200'}">
                        <div class="w-6 h-6 flex-shrink-0 rounded-full border-2 mr-3 flex items-center justify-center ${isSelected ? 'bg-indigo-600 border-indigo-600' : 'border-gray-300'}">
                            ${isSelected ? '<i class="fas fa-check text-white text-xs"></i>' : ''}
                        </div>
                        <span class="text-gray-800">${opt.text}</span>
                    </div>
                `;
            }).join('');
            document.getElementById('options-container').innerHTML = optionsHtml;

            // Navigation buttons
            document.getElementById('btn-prev').disabled = qIndex === 0;
            if (qIndex === totalQ - 1) {
                document.getElementById('btn-next').classList.add('hidden');
                document.getElementById('btn-submit').classList.remove('hidden');
            } else {
                document.getElementById('btn-next').classList.remove('hidden');
                document.getElementById('btn-submit').classList.add('hidden');
            }
        }

        function selectOption(questionId, optionId) {
            currentAttemptState.answers[questionId] = optionId;
            renderQuestion();
        }

        function navigateQuestion(direction) {
            currentAttemptState.currentQuestionIndex += direction;
            renderQuestion();
        }

        function submitQuiz() {
            clearInterval(timerInterval);
            const quiz = getQuizzes().find(q => q.id === currentAttemptState.quizId);
            let correctCount = 0;
            
            // Calculate score
            quiz.questions.forEach(q => {
                const selectedOptId = currentAttemptState.answers[q.id];
                const correctOpt = q.options.find(o => o.isCorrect);
                if (selectedOptId === correctOpt?.id) {
                    correctCount++;
                }
            });

            const attempt = {
                id: 'a' + Date.now(),
                userId: currentAttemptState.userId,
                quizId: currentAttemptState.quizId,
                score: correctCount,
                totalQuestions: quiz.questions.length,
                answers: currentAttemptState.answers,
                completedAt: new Date().toISOString()
            };

            let attempts = getAttempts();
            attempts.push(attempt);
            saveAttempts(attempts);

            showResults(quiz, attempt);
        }

        function showResults(quiz, attempt) {
            navigate('results');
            const percentage = Math.round((attempt.score / attempt.totalQuestions) * 100);
            document.getElementById('result-score').textContent = `${percentage}%`;
            document.getElementById('result-summary').textContent = `${attempt.score} out of ${attempt.totalQuestions} correct`;

            const reviewHtml = quiz.questions.map((q, index) => {
                const selectedOptId = attempt.answers[q.id];
                const correctOpt = q.options.find(o => o.isCorrect);
                const isCorrect = selectedOptId === correctOpt?.id;
                const selectedOpt = q.options.find(o => o.id === selectedOptId);

                return `
                    <div class="p-4 border rounded-lg ${isCorrect ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}">
                        <div class="flex items-start">
                            <div class="flex-shrink-0 mt-1">
                                ${isCorrect ? '<i class="fas fa-check-circle text-green-500 text-xl"></i>' : '<i class="fas fa-times-circle text-red-500 text-xl"></i>'}
                            </div>
                            <div class="ml-3 w-full">
                                <h4 class="font-bold text-gray-800">${index + 1}. ${q.text}</h4>
                                <div class="mt-2 text-sm">
                                    <p>Your answer: <span class="font-semibold ${isCorrect ? 'text-green-700' : 'text-red-700'}">${selectedOpt ? selectedOpt.text : 'None'}</span></p>
                                    ${!isCorrect ? `<p class="text-green-700">Correct answer: <span class="font-semibold">${correctOpt.text}</span></p>` : ''}
                                    ${q.explanation ? `<p class="mt-2 text-gray-600 italic"><i class="fas fa-info-circle mr-1"></i> ${q.explanation}</p>` : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('result-review').innerHTML = reviewHtml;
        }

        // --- CREATOR DASHBOARD LOGIC ---
        function renderCreatorDashboard() {
            const user = getCurrentUser();
            if (!user || user.role !== 'creator') {
                alert("Access denied.");
                navigate('home');
                return;
            }

            const quizzes = getQuizzes().filter(q => q.creatorId === user.id);
            const container = document.getElementById('creator-quiz-list');

            if (quizzes.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-500 py-10 bg-white rounded-lg shadow">You haven't created any quizzes yet.</div>`;
                return;
            }

            container.innerHTML = quizzes.map(q => `
                <div class="bg-white p-4 rounded-lg shadow-md flex justify-between items-center border border-gray-100">
                    <div>
                        <h3 class="font-bold text-lg text-gray-800">${q.title}</h3>
                        <span class="text-xs font-semibold px-2 py-1 rounded ${q.isPublished ? 'bg-green-100 text-green-600' : 'bg-yellow-100 text-yellow-600'}">
                            ${q.isPublished ? 'Published' : 'Draft'}
                        </span>
                        <span class="text-xs text-gray-500 ml-2">${q.questions.length} Questions</span>
                    </div>
                    <div class="flex space-x-2">
                        <button onclick="editQuiz('${q.id}')" class="bg-blue-500 text-white px-3 py-1 rounded text-sm hover:bg-blue-600"><i class="fas fa-edit"></i> Edit</button>
                        <button onclick="deleteQuiz('${q.id}')" class="bg-red-500 text-white px-3 py-1 rounded text-sm hover:bg-red-600"><i class="fas fa-trash"></i> Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function showCreateQuizForm() {
            document.getElementById('creator-form-container').classList.remove('hidden');
            document.getElementById('form-title').textContent = 'Create New Quiz';
            document.getElementById('quiz-edit-id').value = '';
            document.getElementById('quiz-title').value = '';
            document.getElementById('quiz-category').value = '';
            document.getElementById('quiz-desc').value = '';
            document.getElementById('quiz-time').value = 0;
            document.getElementById('quiz-attempts').value = 0;
            document.getElementById('quiz-published').checked = false;
            document.getElementById('questions-list-editor').innerHTML = '';
            addQuestionToForm(); // Add one empty question by default
        }

        function hideCreateQuizForm() {
            document.getElementById('creator-form-container').classList.add('hidden');
        }

        let questionCounter = 0;
        function addQuestionToForm() {
            questionCounter++;
            const container = document.getElementById('questions-list-editor');
            const qHtml = `
                <div class="border p-4 rounded-lg bg-gray-50" id="form-q-${questionCounter}">
                    <div class="flex justify-between mb-2">
                        <h5 class="font-bold text-gray-700">Question #${document.querySelectorAll('#questions-list-editor > div').length + 1}</h5>
                        <button type="button" onclick="this.parentElement.parentElement.remove()" class="text-red-500 hover:text-red-700 text-sm"><i class="fas fa-times"></i> Remove</button>
                    </div>
                    <input type="text" placeholder="Question text..." class="w-full px-3 py-2 border rounded mb-2 q-text" required>
                    <select class="mb-2 border rounded py-2 q-type" onchange="toggleQuestionType(this)">
                        <option value="multiple_choice">Multiple Choice</option>
                        <option value="true_false">True / False</option>
                    </select>
                    <div class="q-options-container space-y-2">
                        <div class="flex items-center space-x-2">
                            <input type="radio" name="correct-${questionCounter}" value="0" checked class="q-correct">
                            <input type="text" placeholder="Option A" class="flex-1 px-3 py-1 border rounded q-opt-text">
                        </div>
                        <div class="flex items-center space-x-2">
                            <input type="radio" name="correct-${questionCounter}" value="1" class="q-correct">
                            <input type="text" placeholder="Option B" class="flex-1 px-3 py-1 border rounded q-opt-text">
                        </div>
                        <div class="flex items-center space-x-2">
                            <input type="radio" name="correct-${questionCounter}" value="2" class="q-correct">
                            <input type="text" placeholder="Option C" class="flex-1 px-3 py-1 border rounded q-opt-text">
                        </div>
                        <div class="flex items-center space-x-2">
                            <input type="radio" name="correct-${questionCounter}" value="3" class="q-correct">
                            <input type="text" placeholder="Option D" class="flex-1 px-3 py-1 border rounded q-opt-text">
                        </div>
                    </div>
                    <input type="text" placeholder="Explanation (optional)" class="w-full px-3 py-2 border rounded mt-2 q-explanation">
                </div>
            `;
            container.insertAdjacentHTML('beforeend', qHtml);
        }

        function toggleQuestionType(selectEl) {
            const container = selectEl.nextElementSibling;
            if (selectEl.value === 'true_false') {
                container.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <input type="radio" name="correct-${Math.random()}" value="0" checked class="q-correct">
                        <span class="px-3 py-1 border rounded bg-white">True</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <input type="radio" name="correct-${Math.random()}" value="1" class="q-correct">
                        <span class="px-3 py-1 border rounded bg-white">False</span>
                    </div>
                `;
            } else {
                // Revert back to MCQs - simple reset approach for demo
                container.innerHTML = `
                    <div class="flex items-center space-x-2"><input type="radio" name="correct-${Math.random()}" value="0" checked class="q-correct"><input type="text" placeholder="Option A" class="flex-1 px-3 py-1 border rounded q-opt-text"></div>
                    <div class="flex items-center space-x-2"><input type="radio" name="correct-${Math.random()}" value="1" class="q-correct"><input type="text" placeholder="Option B" class="flex-1 px-3 py-1 border rounded q-opt-text"></div>
                    <div class="flex items-center space-x-2"><input type="radio" name="correct-${Math.random()}" value="2" class="q-correct"><input type="text" placeholder="Option C" class="flex-1 px-3 py-1 border rounded q-opt-text"></div>
                    <div class="flex items-center space-x-2"><input type="radio" name="correct-${Math.random()}" value="3" class="q-correct"><input type="text" placeholder="Option D" class="flex-1 px-3 py-1 border rounded q-opt-text"></div>
                `;
            }
        }

        function saveQuiz(e) {
            e.preventDefault();
            const user = getCurrentUser();
            const editId = document.getElementById('quiz-edit-id').value;
            
            const quizData = {
                id: editId || 'q' + Date.now(),
                creatorId: user.id,
                title: document.getElementById('quiz-title').value,
                category: document.getElementById('quiz-category').value,
                description: document.getElementById('quiz-desc').value,
                timeLimit: parseInt(document.getElementById('quiz-time').value),
                maxAttempts: parseInt(document.getElementById('quiz-attempts').value),
                isPublished: document.getElementById('quiz-published').checked,
                questions: []
            };

            // Parse questions from DOM
            const questionNodes = document.querySelectorAll('#questions-list-editor > div');
            questionNodes.forEach(qNode => {
                const text = qNode.querySelector('.q-text').value;
                const type = qNode.querySelector('.q-type').value;
                const explanation = qNode.querySelector('.q-explanation').value;
                
                const options = [];
                const optTexts = qNode.querySelectorAll('.q-opt-text');
                const optCorrects = qNode.querySelectorAll('.q-correct');
                
                let optLabels = type === 'true_false' ? ['True', 'False'] : ['A', 'B', 'C', 'D'];
                
                optTexts.forEach((optInput, index) => {
                    if (optInput.value || type === 'true_false') {
                        options.push({
                            id: 'o' + Date.now() + index,
                            text: type === 'true_false' ? optLabels[index] : optInput.value,
                            isCorrect: optCorrects[index]?.checked || false
                        });
                    }
                });

                quizData.questions.push({
                    id: 'q' + Date.now() + Math.random(),
                    text,
                    type,
                    explanation,
                    points: 1,
                    options
                });
            });

            let quizzes = getQuizzes();
            if (editId) {
                quizzes = quizzes.map(q => q.id === editId ? quizData : q);
            } else {
                quizzes.push(quizData);
            }
            saveQuizzes(quizzes);

            hideCreateQuizForm();
            renderCreatorDashboard();
        }

        function editQuiz(quizId) {
            const quiz = getQuizzes().find(q => q.id === quizId);
            if (!quiz) return;

            showCreateQuizForm();
            document.getElementById('form-title').textContent = 'Edit Quiz';
            document.getElementById('quiz-edit-id').value = quiz.id;
            document.getElementById('quiz-title').value = quiz.title;
            document.getElementById('quiz-category').value = quiz.category;
            document.getElementById('quiz-desc').value = quiz.description;
            document.getElementById('quiz-time').value = quiz.timeLimit;
            document.getElementById('quiz-attempts').value = quiz.maxAttempts;
            document.getElementById('quiz-published').checked = quiz.isPublished;

            const questionsContainer = document.getElementById('questions-list-editor');
            questionsContainer.innerHTML = ''; // Clear default
            
            quiz.questions.forEach(q => {
                questionCounter++;
                const isTF = q.type === 'true_false';
                
                let optionsHtml = '';
                if (isTF) {
                    optionsHtml = `
                        <div class="flex items-center space-x-2"><input type="radio" name="correct-${questionCounter}" value="0" ${q.options[0].isCorrect ? 'checked' : ''} class="q-correct"><span class="px-3 py-1 border rounded bg-white">True</span></div>
                        <div class="flex items-center space-x-2"><input type="radio" name="correct-${questionCounter}" value="1" ${q.options[1].isCorrect ? 'checked' : ''} class="q-correct"><span class="px-3 py-1 border rounded bg-white">False</span></div>
                    `;
                } else {
                    q.options.forEach((opt, idx) => {
                        optionsHtml += `
                            <div class="flex items-center space-x-2">
                                <input type="radio" name="correct-${questionCounter}" value="${idx}" ${opt.isCorrect ? 'checked' : ''} class="q-correct">
                                <input type="text" value="${opt.text}" class="flex-1 px-3 py-1 border rounded q-opt-text">
                            </div>
                        `;
                    });
                }

                const qHtml = `
                    <div class="border p-4 rounded-lg bg-gray-50" id="form-q-${questionCounter}">
                        <div class="flex justify-between mb-2">
                            <h5 class="font-bold text-gray-700">Question</h5>
                            <button type="button" onclick="this.parentElement.parentElement.remove()" class="text-red-500 hover:text-red-700 text-sm"><i class="fas fa-times"></i> Remove</button>
                        </div>
                        <input type="text" value="${q.text}" placeholder="Question text..." class="w-full px-3 py-2 border rounded mb-2 q-text" required>
                        <select class="mb-2 border rounded py-2 q-type" onchange="toggleQuestionType(this)">
                            <option value="multiple_choice" ${!isTF ? 'selected' : ''}>Multiple Choice</option>
                            <option value="true_false" ${isTF ? 'selected' : ''}>True / False</option>
                        </select>
                        <div class="q-options-container space-y-2">${optionsHtml}</div>
                        <input type="text" value="${q.explanation || ''}" placeholder="Explanation (optional)" class="w-full px-3 py-2 border rounded mt-2 q-explanation">
                    </div>
                `;
                questionsContainer.insertAdjacentHTML('beforeend', qHtml);
            });
        }

        function deleteQuiz(quizId) {
            if (!confirm("Are you sure you want to delete this quiz?")) return;
            let quizzes = getQuizzes().filter(q => q.id !== quizId);
            saveQuizzes(quizzes);
            renderCreatorDashboard();
        }

        // --- INITIALIZATION ---
        window.onload = () => {
            initSampleData();
            navigate('home');
        };
    </script>
</body>
</html>
